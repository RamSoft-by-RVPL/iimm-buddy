plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Reads google-services.json (the Firebase project used for push).
    id "com.google.gms.google-services"
}

// `-Pstore=play` builds the Google Play bundle: signed with the Play upload
// key, aimed at the Android version Play asks for, and without the
// permissions Play does not allow this kind of app (see src/play).
def playStore = project.findProperty("store") == "play"

android {
    namespace = "in.bharadia.attendance_planner"
    compileSdk = playStore ? 36 : 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "in.bharadia.attendance_planner"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        multiDexEnabled true
        targetSdk = playStore ? 36 : flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Every installed copy is signed with one key (the Android debug key of
    // the first build machine). The GitHub build passes that key's file in
    // APP_KEYSTORE; builds on the Mac use the same key from ~/.android.
    signingConfigs {
        play {
            def ks = System.getenv("UPLOAD_KEYSTORE")
            if (ks) {
                storeFile = file(ks)
                storePassword = System.getenv("UPLOAD_STORE_PASSWORD")
                keyAlias = System.getenv("UPLOAD_KEY_ALIAS") ?: "upload"
                keyPassword = System.getenv("UPLOAD_KEY_PASSWORD") ?: System.getenv("UPLOAD_STORE_PASSWORD")
            }
        }
        app {
            def ks = System.getenv("APP_KEYSTORE")
            if (ks) {
                storeFile = file(ks)
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
    }

    if (playStore) {
        if (!System.getenv("UPLOAD_KEYSTORE")) {
            throw new GradleException("The Play build needs UPLOAD_KEYSTORE and UPLOAD_STORE_PASSWORD")
        }
        sourceSets.release.manifest.srcFile "src/play/AndroidManifest.xml"
    }

    buildTypes {
        release {
            signingConfig = playStore ? signingConfigs.play
                : System.getenv("APP_KEYSTORE") ? signingConfigs.app : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// Newer androidx.work needs a newer Android Gradle plugin than this Flutter
// version ships with; 2.9.1 is the last one that builds here.
configurations.all {
    resolutionStrategy {
        force "androidx.work:work-runtime:2.9.1"
        force "androidx.work:work-runtime-ktx:2.9.1"
    }
}
