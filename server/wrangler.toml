# Cloudflare Pages: the site (public/) and the API (functions/ -> api/*.js).
# Build command: node lib/fetch-release.js   (copies the newest APK in)
# Settings (DATABASE_URL, ADMIN_KEY, FCM_SERVICE_ACCOUNT) are secrets on
# the Pages project, never in this file.
name = "iimm-buddy"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
